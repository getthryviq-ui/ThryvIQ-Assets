<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debt-to-Investment Tradeoff Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; }
        .slider { -webkit-appearance: none; width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: #2563eb; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold mb-6">Debt vs. Investment Engine</h1>
        <div class="grid md:grid-cols-2 gap-8">
            <div class="space-y-4">
                <label class="block text-sm font-medium">Debt Rate: <span id="debt-val" class="font-bold text-blue-600">7.5%</span></label>
                <input type="range" id="debt-rate" class="slider" min="0" max="20" step="0.1" value="7.5">
                
                <label class="block text-sm font-medium">Market Return: <span id="market-val" class="font-bold text-blue-600">9.0%</span></label>
                <input type="range" id="market-return" class="slider" min="0" max="15" step="0.1" value="9">
                
                <div id="result" class="p-4 mt-4 rounded-lg font-bold text-center"></div>
            </div>
            <div class="bg-gray-50 p-6 rounded-lg border">
                <h2 class="font-bold mb-2">Strategy Summary</h2>
                <p id="summary" class="text-gray-700"></p>
            </div>
        </div>
    </div>
    <script>
        const dr = document.getElementById('debt-rate');
        const mr = document.getElementById('market-return');
        const dv = document.getElementById('debt-val');
        const mv = document.getElementById('market-val');
        const res = document.getElementById('result');
        const sum = document.getElementById('summary');

        function calc() {
            const d = parseFloat(dr.value);
            const m = parseFloat(mr.value);
            dv.textContent = d + "%";
            mv.textContent = m + "%";

            if (m > d) {
                res.textContent = "PRIORITY: INVEST";
                res.className = "p-4 mt-4 rounded-lg font-bold bg-green-100 text-green-800";
                sum.textContent = "Since your expected market return (" + m + "%) is higher than your debt interest (" + d + "%), your capital is mathematically better off working in the market.";
            } else {
                res.textContent = "PRIORITY: DEBT PAYOFF";
                res.className = "p-4 mt-4 rounded-lg font-bold bg-red-100 text-red-800";
                sum.textContent = "Since your debt interest (" + d + "%) is higher than your expected market return (" + m + "%), paying off debt provides a higher, guaranteed return.";
            }
        }
        dr.addEventListener('input', calc);
        mr.addEventListener('input', calc);
        calc();
    </script>
</body>
</html>
