<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThryvIQ Debt Toolkit</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM from CDNs (Universal Builds) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-font-smoothing: antialiased;
        }
        /* Fix for potential layout shifts during icon loading */
        i[data-lucide] {
            display: inline-block;
            width: 1.25rem;
            height: 1.25rem;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script>
        // Since we aren't using Babel (to avoid file:// protocol errors), 
        // we use React.createElement (h) for the UI.
        const { useState, useMemo, useEffect, createElement: h } = React;

        const App = () => {
            const [debts, setDebts] = useState([
                { id: 1, name: 'Credit Card A', balance: 4500, interest: 24.9, minPayment: 135 },
                { id: 2, name: 'Student Loan', balance: 12000, interest: 5.5, minPayment: 150 },
                { id: 3, name: 'Personal Loan', balance: 2500, interest: 12.0, minPayment: 85 },
            ]);

            const [strategy, setStrategy] = useState('snowball');
            const [isAdding, setIsAdding] = useState(false);
            const [newDebt, setNewDebt] = useState({ name: '', balance: '', interest: '', minPayment: '' });

            // Initialize icons whenever state changes that affects the DOM
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [debts, strategy, isAdding]);

            const sortedDebts = useMemo(() => {
                return [...debts].sort((a, b) => {
                    return strategy === 'snowball' ? a.balance - b.balance : b.interest - a.interest;
                });
            }, [debts, strategy]);

            const totals = useMemo(() => {
                const balance = debts.reduce((sum, d) => sum + Number(d.balance), 0);
                const minPay = debts.reduce((sum, d) => sum + Number(d.minPayment), 0);
                return { balance, minPay };
            }, [debts]);

            const handleAddDebt = (e) => {
                e.preventDefault();
                if (!newDebt.name || !newDebt.balance) return;
                setDebts([...debts, { ...newDebt, id: Date.now() }]);
                setNewDebt({ name: '', balance: '', interest: '', minPayment: '' });
                setIsAdding(false);
            };

            const deleteDebt = (id) => {
                setDebts(debts.filter(d => d.id !== id));
            };

            const downloadCSV = () => {
                if (sortedDebts.length === 0) return;
                const headers = ["Priority", "Account Name", "Balance", "Interest Rate (%)", "Minimum Payment"];
                const rows = sortedDebts.map((debt, index) => [index + 1, debt.name, debt.balance, debt.interest, debt.minPayment]);
                const csvContent = [[`Strategy: ${strategy.toUpperCase()}`], headers, ...rows, ["", "TOTALS", totals.balance, "", totals.minPay]].map(e => e.join(",")).join("\n");
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `ThryvIQ_${strategy}_Strategy.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return h('div', { className: 'min-h-screen pb-20' }, [
                // Header
                h('header', { key: 'header', className: 'bg-white border-b border-slate-200 sticky top-0 z-10' }, 
                    h('div', { className: 'max-w-4xl mx-auto px-4 py-4 flex items-center justify-between' }, [
                        h('div', { className: 'flex items-center gap-2' }, [
                            h('div', { className: 'bg-indigo-600 p-2 rounded-lg' }, h('i', { 'data-lucide': 'trending-down', className: 'text-white w-5 h-5' })),
                            h('h1', { className: 'text-xl font-bold tracking-tight' }, 'ThryvIQ Debt Toolkit')
                        ]),
                        h('div', { className: 'hidden sm:flex items-center gap-2 text-slate-500 text-sm font-medium' }, [
                            h('i', { 'data-lucide': 'wallet', className: 'w-4 h-4' }),
                            'Personal Finance Dashboard'
                        ])
                    ])
                ),

                // Main Content
                h('main', { key: 'main', className: 'max-w-4xl mx-auto px-4 pt-8' }, [
                    // Strategy Selector
                    h('div', { className: 'mb-8 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm' }, [
                        h('h2', { className: 'text-lg font-semibold mb-4 text-slate-800' }, 'Choose Your Weapon'),
                        h('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' }, [
                            // Snowball Button
                            h('button', {
                                onClick: () => setStrategy('snowball'),
                                className: `p-5 rounded-xl border-2 text-left transition-all ${strategy === 'snowball' ? 'border-indigo-600 bg-indigo-50/50 ring-4 ring-indigo-500/10' : 'border-slate-100 bg-white hover:border-slate-200'}`
                            }, [
                                h('div', { className: 'flex items-center justify-between mb-2' }, [
                                    h('span', { className: 'font-bold flex items-center gap-2 uppercase text-xs tracking-wider' }, [
                                        h('i', { 'data-lucide': 'zap', className: 'w-4 h-4 text-amber-500' }), 'Debt Snowball'
                                    ]),
                                    strategy === 'snowball' && h('i', { 'data-lucide': 'check-circle-2', className: 'w-5 h-5 text-indigo-600' })
                                ]),
                                h('p', { className: 'text-sm text-slate-600 leading-relaxed' }, [
                                    'Focus on ', h('b', null, 'Motivation'), '. Pay smallest balances first for quick psychological wins.'
                                ])
                            ]),
                            // Avalanche Button
                            h('button', {
                                onClick: () => setStrategy('avalanche'),
                                className: `p-5 rounded-xl border-2 text-left transition-all ${strategy === 'avalanche' ? 'border-indigo-600 bg-indigo-50/50 ring-4 ring-indigo-500/10' : 'border-slate-100 bg-white hover:border-slate-200'}`
                            }, [
                                h('div', { className: 'flex items-center justify-between mb-2' }, [
                                    h('span', { className: 'font-bold flex items-center gap-2 uppercase text-xs tracking-wider' }, [
                                        h('i', { 'data-lucide': 'bar-chart-3', className: 'w-4 h-4 text-emerald-500' }), 'Debt Avalanche'
                                    ]),
                                    strategy === 'avalanche' && h('i', { 'data-lucide': 'check-circle-2', className: 'w-5 h-5 text-indigo-600' })
                                ]),
                                h('p', { className: 'text-sm text-slate-600 leading-relaxed' }, [
                                    'Focus on ', h('b', null, 'Math'), '. Pay highest interest rates first to minimize total interest paid.'
                                ])
                            ])
                        ])
                    ]),

                    // Stats Grid
                    h('div', { className: 'grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8' }, [
                        { label: 'Total Debt', val: `$${totals.balance.toLocaleString()}` },
                        { label: 'Monthly Payments', val: `$${totals.minPay.toLocaleString()}` },
                        { label: 'Active Method', val: strategy, color: 'text-indigo-600 capitalize' }
                    ].map((stat, i) => h('div', { key: i, className: 'bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center sm:text-left' }, [
                        h('p', { className: 'text-xs font-semibold text-slate-500 uppercase mb-1' }, stat.label),
                        h('p', { className: `text-2xl font-bold ${stat.color || 'text-slate-900'}` }, stat.val)
                    ]))),

                    // Table
                    h('div', { className: 'bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden mb-8' }, [
                        h('div', { className: 'p-6 border-b border-slate-100 flex items-center justify-between' }, [
                            h('h2', { className: 'font-bold text-lg' }, 'Debt Ledger'),
                            h('div', { className: 'flex gap-2' }, [
                                h('button', { onClick: downloadCSV, disabled: sortedDebts.length === 0, className: 'hidden sm:flex border border-slate-200 hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium items-center gap-2 transition-colors disabled:opacity-50' }, [
                                    h('i', { 'data-lucide': 'download', className: 'w-4 h-4' }), 'CSV'
                                ]),
                                h('button', { onClick: () => setIsAdding(!isAdding), className: 'bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2' }, [
                                    h('i', { 'data-lucide': 'plus', className: 'w-4 h-4' }), 'Add'
                                ])
                            ])
                        ]),

                        isAdding && h('div', { className: 'p-6 bg-slate-50 border-b' }, h('form', { onSubmit: handleAddDebt, className: 'grid grid-cols-1 md:grid-cols-4 gap-4' }, [
                            h('input', { placeholder: 'Name', className: 'bg-white border p-2 rounded text-sm', value: newDebt.name, onChange: e => setNewDebt({...newDebt, name: e.target.value}), required: true }),
                            h('input', { type: 'number', placeholder: 'Balance', className: 'bg-white border p-2 rounded text-sm', value: newDebt.balance, onChange: e => setNewDebt({...newDebt, balance: e.target.value}), required: true }),
                            h('input', { type: 'number', placeholder: 'Interest %', className: 'bg-white border p-2 rounded text-sm', value: newDebt.interest, onChange: e => setNewDebt({...newDebt, interest: e.target.value}), required: true }),
                            h('div', { className: 'flex gap-2' }, [
                                h('input', { type: 'number', placeholder: 'Min Pay', className: 'flex-1 bg-white border p-2 rounded text-sm', value: newDebt.minPayment, onChange: e => setNewDebt({...newDebt, minPayment: e.target.value}), required: true }),
                                h('button', { type: 'submit', className: 'bg-slate-900 text-white px-4 py-2 rounded text-sm' }, 'Save')
                            ])
                        ])),

                        h('div', { className: 'overflow-x-auto' }, h('table', { className: 'w-full text-left' }, [
                            h('thead', null, h('tr', { className: 'bg-slate-50 text-[11px] font-bold text-slate-500 uppercase tracking-widest border-b' }, 
                                ['Priority', 'Account', 'Balance', 'Interest', 'Min Pay', 'Action'].map((hcell, i) => h('th', { key: i, className: `px-6 py-4 ${i > 1 && i < 5 ? 'text-right' : i === 5 ? 'text-center' : ''}` }, hcell))
                            )),
                            h('tbody', { className: 'divide-y divide-slate-100' }, sortedDebts.map((debt, idx) => h('tr', { key: debt.id, className: `hover:bg-slate-50 ${idx === 0 ? 'bg-amber-50/30' : ''}` }, [
                                h('td', { className: 'px-6 py-4' }, h('div', { className: 'flex items-center gap-2' }, [
                                    h('span', { className: `w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${idx === 0 ? 'bg-amber-100 text-amber-700 ring-2 ring-amber-200' : 'bg-slate-100 text-slate-600'}` }, idx + 1),
                                    idx === 0 && h('span', { className: 'text-[10px] font-bold uppercase text-amber-600' }, 'Attack First')
                                ])),
                                h('td', { className: 'px-6 py-4 font-semibold text-slate-900' }, debt.name),
                                h('td', { className: 'px-6 py-4 text-right tabular-nums' }, `$${Number(debt.balance).toLocaleString()}`),
                                h('td', { className: 'px-6 py-4 text-right tabular-nums' }, `${debt.interest}%`),
                                h('td', { className: 'px-6 py-4 text-right tabular-nums' }, `$${Number(debt.minPayment).toLocaleString()}`),
                                h('td', { className: 'px-6 py-4 text-center' }, h('button', { onClick: () => deleteDebt(debt.id), className: 'text-slate-400 hover:text-red-500 p-2' }, h('i', { 'data-lucide': 'trash-2', className: 'w-4 h-4' })))
                            ])))
                        ]))
                    ]),

                    // Footer Cards
                    h('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-6' }, [
                        h('div', { className: 'bg-slate-900 text-white p-6 rounded-2xl shadow-xl' }, [
                            h('i', { 'data-lucide': 'smartphone', className: 'w-6 h-6 mb-4 text-indigo-400' }),
                            h('h3', { className: 'font-bold text-lg mb-2' }, 'Sync Anywhere'),
                            h('p', { className: 'text-slate-400 text-sm' }, 'This toolkit is built for flexibility. Use it as your primary dashboard to keep your financial goals in focus.')
                        ]),
                        h('div', { className: 'bg-white border border-slate-200 p-6 rounded-2xl md:col-span-2 shadow-sm' }, [
                            h('h3', { className: 'font-bold text-lg mb-4 flex items-center gap-2' }, [
                                h('i', { 'data-lucide': 'info', className: 'w-5 h-5 text-indigo-600' }), 'The Strategy Guide'
                            ]),
                            h('div', { className: 'space-y-4' }, [
                                { t: 'Maintain Minimums', d: 'Keep paying minimums on all accounts to protect your credit. Only apply extra funds to your #1 priority.' },
                                { t: 'Roll the Payments', d: 'When a debt is cleared, take its total payment amount and "roll" it into the next debt on your list.' }
                            ].map((tip, i) => h('div', { key: i, className: 'flex gap-4' }, [
                                h('div', { className: 'w-8 h-8 rounded-lg bg-indigo-50 flex items-center justify-center shrink-0' }, h('span', { className: 'text-indigo-600 font-bold text-sm' }, `0${i+1}`)),
                                h('p', { className: 'text-slate-600 text-xs font-medium' }, [ h('span', { className: 'text-slate-900 block font-bold' }, tip.t), tip.d ])
                            ])))
                        ])
                    ])
                ]),

                // Footer
                h('footer', { key: 'footer', className: 'py-8 px-4 text-center text-xs text-slate-400 font-medium tracking-wide uppercase' }, 'ThryvIQ Financial Freedom Suite © 2024')
            ]);
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(App));
    </script>
</body>
</html>
